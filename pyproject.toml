[project]
name = "sparring-partner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "oskarivatanen94-tech", email = "oskari.vatanen94@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "litellm>=1.101.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "yt-dlp>=2026.8.19",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "types-pyyaml>=6.0.12.20260906",
]
